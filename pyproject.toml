[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycodemath"
version = "0.2.0"
description = "Token-efficient exact math for AI agents: symbolic engine, ODE suite, optimizer and an optimized-code generator (SymPy + NumPy)."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "maisa"}]
keywords = ["math", "symbolic", "ode", "codegen", "mcp", "ai-agents", "sympy", "numpy"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]
mcp = ["mcp>=1.0"]

[project.scripts]
pycodemath = "pycodemath.cli.repl:run"
pycodemath-mcp = "pycodemath.cli.mcp_server:run"

[tool.setuptools.packages.find]
include = ["pycodemath*"]

[tool.mypy]
# Reasonable baseline (not strict): the whole package must pass, without stubs
# for SymPy/mpmath (libraries without py.typed are treated as Any).
# 3.12, not 3.11: NumPy stubs use "type X = ..." (PEP 695), which mypy cannot
# parse under the 3.11 grammar — while our code uses nothing beyond 3.11.
python_version = "3.12"
files = ["pycodemath"]
ignore_missing_imports = true
