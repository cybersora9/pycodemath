<g class="l" style="animation-delay:3.64s"><text x="32.8" y="353.5" fill="#e11d33" font-weight="700" xml:space="preserve">4</text><text x="41.2" y="353.5" fill="#f6f2f3" xml:space="preserve"> Prove the fixed loop correct   </text><text x="310.0" y="353.5" fill="#f6f2f3" font-weight="700" xml:space="preserve">VERIFIED</text><text x="377.2" y="353.5" fill="#f6f2f3" xml:space="preserve">  n**2/2 + n/2 equals n(n+1)/2</text></g>
