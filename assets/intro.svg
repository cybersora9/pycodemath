<g class="l" style="animation-delay:2.33s"><text x="32.8" y="317.5" fill="#e11d33" font-weight="700" xml:space="preserve">2</text><text x="41.2" y="317.5" fill="#f6f2f3" xml:space="preserve"> Find where it&#x27;s wrong, run it  </text><text x="310.0" y="317.5" fill="#ff3a52" font-weight="700" xml:space="preserve">REFUTED</text><text x="368.8" y="317.5" fill="#f6f2f3" xml:space="preserve">  sum_to(n=1) returned 0, not 1</text></g>
